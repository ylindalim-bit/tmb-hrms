{% extends "base.html" %}
{% block title %}Change Password - TMB Payroll{% endblock %}
{% block content %}
<h1>Change Password</h1>

<div class="card" style="max-width:360px;">
  {% if success %}
    <p style="color:var(--accent); font-weight:600;">Password changed successfully.</p>
  {% else %}
    {% if error %}<div style="color:var(--danger); font-size:13px; margin-bottom:12px;">{{ error }}</div>{% endif %}
    <form method="post">
      <label style="display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px;">Current Password</label>
      <input type="password" name="current_password" required style="width:100%; margin-bottom:16px;">
      <label style="display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px;">New Password</label>
      <input type="password" name="new_password" required style="width:100%; margin-bottom:16px;">
      <label style="display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px;">Confirm New Password</label>
      <input type="password" name="confirm_password" required style="width:100%; margin-bottom:16px;">
      <button class="btn" type="submit">Change Password</button>
    </form>
  {% endif %}
</div>
{% endblock %}
