<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Login - TMB Payroll</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { width: 100%; max-width: 340px; }
  .login-box .login-logo { display: block; height: 40px; width: auto; margin: 0 auto 18px; }
  .login-box h1 { font-size: 18px; margin-bottom: 4px; text-align: center; }
  .login-box .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .login-box label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .login-box input { width: 100%; margin-bottom: 16px; }
  .login-box .error { color: var(--danger); font-size: 13px; margin-bottom: 12px; }
  .login-box button { width: 100%; }
  .login-box .label-row { display: flex; justify-content: space-between; align-items: center; }
  .login-box .show-pw { font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; user-select: none; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card login-box">
  <img src="{{ url_for('static', filename='img/tmb_logo.jpg') }}" alt="TMB" class="login-logo">
  <h1>HR / Payroll Login</h1>
  <div class="sub">Staff looking for the Staff Portal? <a href="{{ url_for('portal_login') }}">Go here instead</a>.</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username</label>
    <input type="text" name="username" autofocus required>
    <div class="label-row">
      <label>Password</label>
      <span class="show-pw" onclick="togglePw()" id="show-pw-toggle">Show PW</span>
    </div>
    <input type="password" name="password" id="pw-field" required>
    <button class="btn" type="submit">Sign In</button>
  </form>
</div>
<script>
function togglePw() {
  var field = document.getElementById('pw-field');
  var toggle = document.getElementById('show-pw-toggle');
  if (field.type === 'password') {
    field.type = 'text';
    toggle.textContent = 'Hide PW';
  } else {
    field.type = 'password';
    toggle.textContent = 'Show PW';
  }
}
</script>
</body>
</html>
